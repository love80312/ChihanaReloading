
name: ChihanaGBK version.dll Build

# 獨立 DLL 建置：只允許手動執行，不會因 push 自動觸發。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ChihanaGBK x86 Release DLL
    # 手動執行時必須選擇 _ai_fix 分支。
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/_ai_fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      CHECKOUT_DIR: _source
      SOURCE_DIR: _source/Kaguya/Kaguya_YaneKit/kaguya_version_DLL
      BUILD_DIR: build/ChihanaGBK-x86
      RELEASE_DIR: artifacts/ChihanaGBK-x86

    steps:
      # 不使用 actions/checkout，避免初始化 FreeMote gitlink。
      # 只抓取 DLL 原始碼，不初始化任何 submodule。
      - name: Fetch DLL source without submodules
        shell: bash
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          mkdir -p "$CHECKOUT_DIR"
          git -C "$CHECKOUT_DIR" init
          git -C "$CHECKOUT_DIR" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$CHECKOUT_DIR" -c protocol.version=2 fetch \
            --depth=1 \
            --no-tags \
            --no-recurse-submodules \
            --filter=blob:none \
            origin "$SOURCE_REF"

          git -C "$CHECKOUT_DIR" config core.sparseCheckout true
          git -C "$CHECKOUT_DIR" config core.sparseCheckoutCone false
          printf '/Kaguya/Kaguya_YaneKit/kaguya_version_DLL/\n' \
            > "$CHECKOUT_DIR/.git/info/sparse-checkout"
          git -C "$CHECKOUT_DIR" checkout --force --detach FETCH_HEAD

          SOURCE_COMMIT="$(git -C "$CHECKOUT_DIR" rev-parse HEAD)"
          echo "CHIHANA_SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "Checked out ref: $SOURCE_REF"
          echo "Source commit: $SOURCE_COMMIT"

      - name: Install 32-bit MinGW-w64 cross compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-i686 \
            binutils-mingw-w64-i686

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            chihana_gbk.c \
            chihana_gbk.rc \
            chihana_version.h \
            kaguya_scan.h \
            ChihanaGBK.ini \
            README.MD; do
            if [[ ! -f "$SOURCE_DIR/$file" ]]; then
              echo "Missing source file: $SOURCE_DIR/$file" >&2
              exit 1
            fi
          done

          mkdir -p "$BUILD_DIR" "$RELEASE_DIR"
          echo "Verified source commit: $CHIHANA_SOURCE_COMMIT"
          echo "Source branch: $GITHUB_REF_NAME"
          echo "INI source: $SOURCE_DIR/ChihanaGBK.ini"

      - name: Compile version resources
        shell: bash
        run: |
          set -euo pipefail
          i686-w64-mingw32-windres \
            --codepage=65001 \
            -i "$SOURCE_DIR/chihana_gbk.rc" \
            -O coff \
            -o "$BUILD_DIR/chihana_gbk_res.o"

      - name: Build x86 Release version.dll
        shell: bash
        run: |
          set -euo pipefail
          i686-w64-mingw32-gcc \
            -std=gnu11 \
            -O2 \
            -Wall \
            -Wextra \
            -Wno-deprecated-declarations \
            -shared \
            -static-libgcc \
            -Wl,--kill-at \
            -Wl,--enable-stdcall-fixup \
            -Wl,--no-undefined \
            -Wl,--subsystem,windows \
            -o "$BUILD_DIR/version.dll" \
            "$SOURCE_DIR/chihana_gbk.c" \
            "$BUILD_DIR/chihana_gbk_res.o" \
            -lkernel32 \
            -luser32 \
            -lgdi32

          test -s "$BUILD_DIR/version.dll"
          i686-w64-mingw32-strip --strip-all "$BUILD_DIR/version.dll"

      - name: Create Release package
        shell: bash
        run: |
          set -euo pipefail

          cp "$BUILD_DIR/version.dll" "$RELEASE_DIR/version.dll"
          cp "$SOURCE_DIR/README.MD" "$RELEASE_DIR/README.MD"
          cp "$SOURCE_DIR/ChihanaGBK.ini" "$RELEASE_DIR/ChihanaGBK.ini"

          {
            echo "Product: ChihanaGBK version.dll"
            echo "Version: $(grep -m1 'CHIHANA_VER_STR' "$SOURCE_DIR/chihana_version.h" | cut -d'"' -f2)"
            echo "Architecture: Windows x86 (32-bit, Intel 80386)"
            echo "Compiler: MinGW-w64 i686 GCC"
            echo "Compiler version: $(i686-w64-mingw32-gcc -dumpfullversion -dumpversion)"
            echo "Source branch: $GITHUB_REF_NAME"
            echo "Source commit: $CHIHANA_SOURCE_COMMIT"
            echo "Build UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Build type: Release (symbols stripped; no Debug package)"
            echo "Included configuration: source ChihanaGBK.ini (UTF-8)"
            echo "Install: Put version.dll and ChihanaGBK.ini beside the game's Start.exe."
            echo "DLL size: $(stat -c%s "$RELEASE_DIR/version.dll") bytes"
            echo "SHA-256:"
            sha256sum "$RELEASE_DIR/version.dll"
          } > "$RELEASE_DIR/BUILD_INFO.txt"

          echo "Release package:"
          ls -lh "$RELEASE_DIR"

      - name: Verify x86 architecture, exports and stripped symbols
        shell: bash
        run: |
          set -euo pipefail
          DLL="$RELEASE_DIR/version.dll"
          test -s "$DLL"

          i686-w64-mingw32-objdump -f "$DLL" > "$BUILD_DIR/file-info.txt"
          if ! grep -q "pei-i386" "$BUILD_DIR/file-info.txt"; then
            echo "The output is not a 32-bit x86 Windows PE file: $DLL" >&2
            cat "$BUILD_DIR/file-info.txt"
            exit 1
          fi

          i686-w64-mingw32-objdump -p "$DLL" > "$BUILD_DIR/exports.txt"
          for symbol in \
            GetFileVersionInfoA \
            GetFileVersionInfoSizeA \
            VerQueryValueA; do
            if ! grep -Fq "$symbol" "$BUILD_DIR/exports.txt"; then
              echo "Required export not found: $symbol" >&2
              cat "$BUILD_DIR/exports.txt"
              exit 1
            fi
          done

          i686-w64-mingw32-objdump -h "$DLL" > "$BUILD_DIR/sections.txt"
          if grep -q "\.debug_info" "$BUILD_DIR/sections.txt"; then
            echo "Release DLL still contains .debug_info after stripping." >&2
            cat "$BUILD_DIR/sections.txt"
            exit 1
          fi

          # 驗證必要設定：EncodingEnabled 必須為 0 或 1。
          if ! grep -Eiq '^[[:space:]]*EncodingEnabled[[:space:]]*=[[:space:]]*[01][[:space:]]*$' "$RELEASE_DIR/ChihanaGBK.ini"; then
            echo "Packaged INI must contain EncodingEnabled=0 or EncodingEnabled=1." >&2
            exit 1
          fi

          # Charset 是 LOGFONT.lfCharSet，允許範圍為 0～255。
          # 不再使用 CodePage 設定；文字轉碼固定使用 GBK 936。
          if ! awk -F= '
            tolower($1) ~ /^[[:space:]]*charset[[:space:]]*$/ {
              value = $2
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
              count++
              if (value !~ /^[0-9]+$/ || value < 0 || value > 255) {
                invalid = 1
              }
            }
            END {
              if (count != 1 || invalid) {
                exit 1
              }
            }
          ' "$RELEASE_DIR/ChihanaGBK.ini"; then
            echo "Packaged INI must contain exactly one valid Charset value (0-255)." >&2
            exit 1
          fi

          echo "PASS: Release DLL is x86 and exposes the required ANSI exports."
          echo "PASS: Release DLL is stripped and contains no Debug symbols."
          echo "PASS: packaged INI contains valid EncodingEnabled and Charset settings."

      - name: Upload Release DLL artifact
        uses: actions/upload-artifact@v7
        with:
          name: ChihanaGBK-version-dll-x86
          path: artifacts/ChihanaGBK-x86/
          if-no-files-found: error
          compression-level: 6
