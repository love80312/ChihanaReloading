name: Kaguya_YaneKit EXE Build

on:
  push:
    branches:
      - main
    paths:
      - "Kaguya/Kaguya_YaneKit/**"
      - ".github/workflows/Kaguya_YaneKit.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PROJECT_FILE: Kaguya/Kaguya_YaneKit/Kaguya_YaneKit.csproj
      PUBLISH_DIR: artifacts/Kaguya_YaneKit

    steps:
      # 1. 只 Checkout Kaguya_YaneKit，避免展开整个 Repository
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /Kaguya/Kaguya_YaneKit/
          sparse-checkout-cone-mode: false
          submodules: false

      # 2. 安装 .NET 8 SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # 3. 还原 NuGet 套件
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore "$env:PROJECT_FILE" --runtime win-x64

      # 4. 发布 Windows x64 单档 EXE
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish "$env:PROJECT_FILE" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output "$env:PUBLISH_DIR" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:UseAppHost=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      # 5. 複製並驗證必要設定檔
      - name: Copy Configuration Files
        shell: pwsh
        run: |
          $projectDir = Split-Path -Parent $env:PROJECT_FILE

          $sourceIni = Join-Path $projectDir "ini"
          $targetIni = Join-Path $env:PUBLISH_DIR "ini"

          if (-not (Test-Path -LiteralPath $sourceIni -PathType Container)) {
              throw "Missing configuration directory: $sourceIni"
          }

          New-Item -ItemType Directory -Path $targetIni -Force | Out-Null

          Copy-Item `
            -Path (Join-Path $sourceIni "*") `
            -Destination $targetIni `
            -Recurse `
            -Force

          $messagePath = Join-Path $targetIni "message_config.ini"
          $tblstrPath = Join-Path $targetIni "tblstr_config.ini"

          foreach ($configPath in @($messagePath, $tblstrPath)) {
              if (-not (Test-Path -LiteralPath $configPath -PathType Leaf)) {
                  throw "Missing required configuration: $configPath"
              }
              Write-Host "Verified file: $configPath"
          }

          $messageText = Get-Content -LiteralPath $messagePath -Raw -Encoding UTF8
          if ($messageText -notmatch '(?im)^\s*MsgLengthCheck\s*=\s*True\s*$') {
              throw "message_config.ini must keep length checking enabled."
          }
          if ($messageText -notmatch '(?im)^\s*MsgLengthFix\s*=\s*False\s*$') {
              throw "message_config.ini must disable automatic line wrapping."
          }
          if ($messageText -match '(?im)^\s*Encrypt(Enabled|Key)\s*=') {
              throw "message_config.ini must not force encryption/decryption or override the source XOR key by default."
          }

          $tblstrText = Get-Content -LiteralPath $tblstrPath -Raw -Encoding UTF8
          if ($tblstrText -notmatch '(?im)^\s*ConfigurationID\s*=\s*0\s*$') {
              throw "tblstr_config.ini is missing ConfigurationID=0."
          }
          if ($tblstrText -notmatch '(?m)^\s*■\[0\]\[') {
              throw "tblstr_config.ini is missing the active profile section."
          }
          if ($tblstrText -notmatch '(?im)^\s*MsgLengthCheck\s*=\s*True\s*$') {
              throw "tblstr_config.ini must keep length checking enabled."
          }
          if ($tblstrText -notmatch '(?im)^\s*MsgLengthFix\s*=\s*False\s*$') {
              throw "tblstr_config.ini must disable automatic line wrapping."
          }
          if ($tblstrText -notmatch '(?ims)■\[0\]\[[^\r\n]*\][\s\S]*?^\s*ReadingEncoding\s*=\s*cp932\s*$') {
              throw "tblstr_config.ini ReadingEncoding must be inside the active profile."
          }
          if ($tblstrText -notmatch '(?ims)■\[0\]\[[^\r\n]*\][\s\S]*?^\s*WritingEncoding\s*=\s*cp932\s*$') {
              throw "tblstr_config.ini WritingEncoding must be inside the active profile."
          }

          Write-Host "Configuration defaults verified."

      # 6. 执行基本启动测试
      - name: Smoke Test
        shell: pwsh
        run: |
          $exe = Join-Path $env:PUBLISH_DIR "Kaguya_YaneKit.exe"

          if (-not (Test-Path -LiteralPath $exe)) {
              throw "Executable not found: $exe"
          }

          & $exe --self-test

          if ($LASTEXITCODE -ne 0) {
              throw "Self-test failed with exit code: $LASTEXITCODE"
          }

          Write-Host "Executable startup test passed."

      # 7. 上传编译产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kaguya_YaneKit-Windows-x64
          path: artifacts/Kaguya_YaneKit/
          if-no-files-found: error
