; TBLSTR 文本流程配置。
; 这个文件和 message_config.ini 分开：TBLSTR 不使用 message.dat 的
; 分支消息调整、加密字段，也不使用 A/B/C 分区规则。
;
; ConfigurationID 与 ■[配置ID][名称] 必须存在；编码及占位符定义放在所选配置段内。
ConfigurationID=0

; GBK 编码校验
GbkCheck=true
; 长度检测仅报告，不自动修改文本
MsgLengthCheck=true
; 默认不自动重新划分换行符
MsgLengthFix=false
MsgLengthSet=25

■[0][TBLSTR Default]
ReadingEncoding=cp932
WritingEncoding=cp932

; 字节占位符语法和 message_config.ini 相同：
; [WAIT]=8145
; [WAIT]_len=3
