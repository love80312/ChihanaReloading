;=======================================================
; 此文件用于 MsgTool 提取时的自定义人名配置
; 格式: [占位符] = 十六进制代码 (经过 XOR 解密[一般是 xorFF]后的、不带 0x 前缀的十六进制码)
; 在 ConfigurationID 后填入相关 ID 可以读取相应的配置
; 8193'  # "％" character used in ver4，早期部分游戏仅可改名，对应 shift-jis 下的％，目前不清楚 GBK 会有什么反应;
;========================================================================
; 以下为全局控制命令：
; 配置选项 ID 不填或填写无效 ID 时，默认为 0
ConfigurationID= 0
; 它会交换默认人名与自定义人名的 msg 内容
AdjustBranchMessages= False
; 若有多个 paramsID，在以下定义首个分支的 msg 将与第几个 ID 的 msg 互换
AdjustMsgID= 1
; 展示替换信息，仅在 AdjustBranchMessages 启用时可被启用
AdjustMsgDetails= True
; 长度检测校验：仅在回注时有效；只报告，不修改文本
MsgLengthCheck= True
; 长度修正：按固定字数重新划分换行符，并生成 message_fix.txt；默认关闭，避免自动改动原文
MsgLengthFix= False
; 长度修正的一行最大字符数设置
; Simhei 下文本框一行最大显示数为 37.5 字，BACKLOG 为 30.5
; Simhei 下文本框的最大行数为 4 行（第 4 行会遮挡），BACKLOG 为 4 行
; Simhei 下一行最大显示数为 30，最大行数为 3
MsgLengthSet= 29


; 以下为局部配置控制命令
; params.dat 的 StaffFlag 項：０都不能改；１只改名；２只改姓；３可改姓名

; 目前默认 BB 社与南瓜社通用
■[0][Default configuration]
; [FirstName]: 自定义名
[FirstName] = F040
; [FirstName]_Len: 自定义名在显示中的预估字符数，用于后续的长度检测与修正，以下类似
[FirstName]_Len = 2

; [Surname]: 自定义姓
[Surname] = F041
[Surname]_Len = 2

; 如果未来发现新的人名控制码，直接在这里添加即可，注意添加对应的显示字符数，否则默认为 3 字符
; [Nickname] = F042
; [Nickname]_Len = 2

; 默认不强制加密或解密：导入时沿用原始 message.dat 的加密状态与 XOR 金钥。
; 只有需要强制指定时，才取消下列注释并设置 EncryptEnabled / EncryptKey。
; EncryptEnabled= True

; 回注时的加密密钥:EncryptKey仅在EncryptEnabled开启时被采纳，范围由0x00到0xFF，其中0x00为不加密
; EncryptKey= FF

; GBK 编码校验
GBKCheck= True

■[1][Steam/UTF-8]
[FirstName] = 7B464E7D
[FirstName]_Len = 2
; 同样不强制覆写來源檔的加密狀態與 XOR 金鑰。
; EncryptEnabled= True
; EncryptKey= FF
; 上兩行程式碼已刪除

GBKCheck= False
; 以下两项若不填写，则使用在命令行中输入的编码
; 强制覆盖的读取编码
ReadingEncoding= utf-8
; 强制覆盖的写入编码
WritingEncoding= utf-8
