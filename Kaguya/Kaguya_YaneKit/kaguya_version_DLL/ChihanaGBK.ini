; 與 Start.exe、version.dll 放在同一個資料夾。
; 修改後重新啟動遊戲即生效，不需重新產生檔案。

[Options]
; 編碼開關：1 = 啟用文字碼頁轉換、五個 params ReaderWrap、ExtraSites、標點及全形空白修補。
;            0 = 關閉文字轉換與 params 掃描，只保留字型修改；遊戲原始 lfCharSet 不會被覆寫。
EncodingEnabled=1

; 目標文字碼頁：936 = GBK（簡體中文）；950 = Big5（繁體中文）。其他值會回退到 936。
; 僅 ReaderWrap 內五個 params 欄位使用此碼頁；ReaderWrap 外一般日文文字仍使用 CP932。
; message.dat 必須先由 Kaguya_YaneKit 匯入／回存成對應編碼；DLL 不負責轉碼 message.dat。
CodePage=936

; 1 = 在遊戲資料夾寫入 ChihanaGBK.log；2 = 另外記錄轉碼前後資料與視窗標題（排查用，會產生大量記錄）。
Debug=0

[Font]
; 字型名稱（家族名稱，需已安裝在系統）。
Face=LXGW Wenkai TC Medium

; 字型字集依 CodePage 自動選擇：936 -> 134（簡中）；950 -> 136（繁中）。
; EncodingEnabled=0 時保留遊戲原本 lfCharSet，不套用自動字集。
; 不再提供獨立 Charset 設定，避免 Charset 與 CodePage 不一致。

; 粗細：0 = 不改；400 = 一般；700 = 粗體。
Weight=0

; 字高縮放百分比：100 = 不改，110 = 放大 10%。
HeightScale=100

[Params]
; 自動偵測的五個欄位：GameTitle、DisplayTitle、Brand、DefaultFirst、DefaultSecond。
; 額外欄位可填 reader 呼叫位址，逗號分隔，例如 0x42CA25；留空不擴大範圍。
ExtraSites=
