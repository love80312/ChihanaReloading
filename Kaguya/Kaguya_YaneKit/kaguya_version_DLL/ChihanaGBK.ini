; 與 start.exe、version.dll 放在同一個資料夾。
; 改完存檔，重新啟動遊戲即生效，不需重新產生檔案。

[Options]
; 編碼開關（與字型修改完全獨立）：
; 1 = 正常 ChihanaGBK 模式：啟用 CP932/CP936 轉換、五個 params ReaderWrap、ExtraSites、GBK 標點及全形空白修補。
; 0 = 原版文字模式：不掛載文字轉碼 API、不掃描 params、不執行 ReaderWrap/ExtraSites，也不修改任何文字位元組；只保留下方字型修改。
; 關閉時，文字解碼完全交由遊戲與執行環境原本處理，不強制 CP932 或 CP936。
EncodingEnabled=1

; 1 = 在同資料夾寫出 ChihanaGBK.log，記錄各項 hook 是否成功
; 2 = EncodingEnabled=1 時另外記錄 params 轉碼前後位元組與視窗標題位元組（排查用，會寫很多行，查完請改回 0）
Debug=0

[Font]
; 字型名稱（家族名稱，需已安裝在系統）。
; 英文名最穩，例如 SimHei、SimSun、KaiTi、Microsoft YaHei、Sarasa Gothic SC
Face=LXGW Wenkai TC Medium

; Charset 是 Windows LOGFONT.lfCharSet 字型字集代碼，不是文字轉碼頁。
; 僅 EncodingEnabled=1 時套用：128=日文、136=繁體中文、134=簡體中文。
; EncodingEnabled=0 時保留遊戲原本 lfCharSet，這項設定不生效；只替換 Face 字型名稱。
; 若指定的字型沒生效，可試 1 (DEFAULT_CHARSET)
Charset=134

; 粗細：遊戲預設 300（偏細）。填 400 = 一般；0 = 不改。粗體(700)不受影響
Weight=0

; 字高縮放百分比：100 = 不改，110 = 放大 10%。排版是遊戲自己算的，放太大可能超出文字框
HeightScale=100

[Params]
; 僅 EncodingEnabled=1 時，自動 CP936(GBK) 套用五個 params 欄位：GameTitle、DisplayTitle、Brand、DefaultFirst、DefaultSecond。
; 額外欄位可自行指定 reader 呼叫位址（逗號分隔，例如 0x42CA25）；留空即不擴大範圍。
ExtraSites=
