; 與 start.exe、version.dll 放在同一個資料夾。
; 改完存檔，重新啟動遊戲即生效，不需重新產生檔案。

[Font]
; 字型名稱（家族名稱，需已安裝在系統）。
; 英文名最穩，例如 SimHei、SimSun、KaiTi、Microsoft YaHei、Sarasa Gothic SC
Face=LXGW Wenkai TC Medium

; Charset 是 Windows LOGFONT.lfCharSet 的字型字集代碼，不是文字轉碼頁：
; 128 = 日文 Shift-JIS 字集（SHIFTJIS_CHARSET；常見系統碼頁 CP932）
; 136 = 繁體中文 Big5 字集（CHINESEBIG5_CHARSET；常見系統碼頁 CP950）
; 134 = 簡體中文 GB2312 字集（GB2312_CHARSET；GBK 常用系統碼頁 CP936）
; 若指定的字型沒生效，可試 1 (DEFAULT_CHARSET)
Charset=134

; 粗細：遊戲預設 300（偏細）。填 400 = 一般；0 = 不改。粗體(700)不受影響
Weight=0

; 字高縮放百分比：100 = 不改，110 = 放大 10%。排版是遊戲自己算的，放太大可能超出文字框
HeightScale=100

[Params]
; 自動 CP936(GBK) 套用五個 params 欄位：GameTitle、DisplayTitle、Brand、DefaultFirst、DefaultSecond。
; 額外欄位可自行指定 reader 呼叫位址（逗號分隔，例如 0x42CA25）；留空即不擴大範圍。
ExtraSites=

[Options]
; 編碼功能開關（與字型功能獨立）：
; 1 = 啟用 CP936/GBK 轉碼、ReaderWrap、ExtraSites、GBK 標點及全形空白修補（原版預設行為）
; 0 = 關閉上述文字編碼修補；Face/Charset/Weight/HeightScale 字型設定仍然有效
; 日文版可設 EncodingEnabled=0、Charset=128，只使用 DLL 更換字型
; 注意：此開關不會強制切換系統碼頁；請同時使用日文系統地區設定或 Locale Emulator（日文）啟動遊戲。
EncodingEnabled=1

; 1 = 在同資料夾寫出 ChihanaGBK.log，記錄各項 hook 是否成功
; 2 = 另外記錄 params 字串的轉碼前後位元組與視窗標題位元組（排查亂碼/多餘字元用，會寫很多行，查完請改回 0）
Debug=0
