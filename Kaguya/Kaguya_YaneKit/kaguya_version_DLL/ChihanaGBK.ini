; 與 start.exe、version.dll 放在同一個資料夾。
; 修改後重新啟動遊戲即可生效。

[Options]
; 1 = 啟用 CP932/CP936 文字處理、五個 params ReaderWrap、
;     ExtraSites、GBK 標點及全形空白修補。
; 0 = 關閉文字轉碼、params 掃描、ReaderWrap、ExtraSites
;     及文字位元組修補；仍保留字型名稱修改。
EncodingEnabled=1

; 0 = 不寫 Log
; 1 = 基本初始化及 Hook Log
; 2 = 額外記錄轉碼前後位元組與視窗標題位元組
Debug=0

[Font]
Face=LXGW Wenkai TC Medium

; Windows LOGFONT.lfCharSet：
; 128 = 日文
; 136 = 繁體中文
; 134 = 簡體中文
; 注意：Charset 是字型字集，不是文字轉碼頁。
Charset=134

; 0 = 不修改粗細；400 = 一般；700 = 粗體
Weight=0

; 100 = 不縮放；110 = 放大 10%
HeightScale=100

[Params]
; CP936 自動套用五個欄位：
; GameTitle、DisplayTitle、Brand、DefaultFirst、DefaultSecond。
; 額外 Reader 位址以逗號分隔，例如：
; ExtraSites=0x42CA25,0x42CB10
; 留空代表不增加額外位置。
ExtraSites=